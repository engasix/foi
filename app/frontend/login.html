<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FOI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0f14;
    --surface: #161920;
    --border:  #252830;
    --accent:  #4f7cff;
    --accent2: #7c4fff;
    --text:    #e8eaf0;
    --muted:   #6b7280;
    --error:   #ef4444;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 360px;
    padding: 32px;
  }

  .logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 28px; }
  .logo-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: #fff;
  }
  .logo-text { font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
  .logo-sub  { font-size: 11px; color: var(--muted); margin-top: 1px; }

  h1 {
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 24px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }

  input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }

  .submit-btn {
    margin-top: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  .submit-btn:hover { opacity: .9; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

  .error {
    display: none;
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    color: var(--error);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
  }
  .error.visible { display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">F</div>
    <div>
      <div class="logo-text">FOI</div>
      <div class="logo-sub">Family Office Intelligence</div>
    </div>
  </div>

  <h1>Sign in</h1>

  <form id="loginForm">
    <div class="error" id="errorBox"></div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username" autofocus>
    </div>
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
  </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  errorBox.classList.remove('visible');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'Login failed.' }));
      errorBox.textContent = err.detail || 'Login failed.';
      errorBox.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }

    window.location.href = '/';
  } catch (err) {
    errorBox.textContent = 'Network error: ' + err.message;
    errorBox.classList.add('visible');
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
